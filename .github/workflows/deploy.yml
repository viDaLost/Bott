# Деплой бота в Telegram Serverless без компьютера.
# Нужен секрет репозитория TGCLOUD_TOKEN (Settings → Secrets and variables → Actions):
# @BotFather → бот → Serverless → CLI Access → Access token.
# Запуск: при пуше в ветку или вручную — Actions → Deploy → Run workflow.
name: Deploy

on:
  push:
    branches: [claude/telegram-serverless]
    paths: ['tgcloud/**', 'test/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Проверка токена
        if: env.TGCLOUD_TOKEN == ''
        run: echo "::warning::Секрет TGCLOUD_TOKEN не задан — тесты прошли, деплой пропущен."

      - name: Деплой кода
        if: env.TGCLOUD_TOKEN != ''
        run: |
          npx tgcloud init --no-git
          # CLI 0.2.0 может упасть уже после успешного деплоя (при записи локального
          # снимка), поэтому результат проверяет следующий шаг, а не код возврата.
          npx tgcloud push --force || echo "::warning::tgcloud push завершился с ошибкой — сверяю облако с репозиторием"

      - name: Сверка облака с репозиторием
        if: env.TGCLOUD_TOKEN != ''
        run: node scripts/check-deploy.mjs

      - name: Миграция базы
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud migrate --yes

      - name: Webhook
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud webhook

      # Проверяет YouTube, TikTok, Instagram и X из облака Telegram — с тех же адресов,
      # что и бот. Модуль запускается без деплоя; падение здесь не ломает деплой.
      - name: Проверка источников
        if: env.TGCLOUD_TOKEN != ''
        continue-on-error: true
        run: |
          mkdir -p tgcloud/endpoints
          cp scripts/probe-endpoint.js tgcloud/endpoints/probe.js
          # свои ссылки для проверки можно положить в scripts/probe-input.json:
          # { "instagram": "https://www.instagram.com/reel/…", "youtube": "<id видео>" }
          npx tgcloud run endpoints/probe "$(cat scripts/probe-input.json)"
